<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Mental Health Support Assistant{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">🌿 Campus Care AI</div>
        <ul class="nav-links">
            <li><a href="{{ url_for('index') }}">Home (Chat)</a></li>
            <li><a href="{{ url_for('wellness') }}">Wellness Tools</a></li>
            <li><a href="{{ url_for('maps') }}">Maps & Ambulance</a></li>
            <li><a href="{{ url_for('about') }}">About</a></li>
            <li><a href="{{ url_for('helpline') }}">Helplines</a></li>
        </ul>
    </nav>

    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
